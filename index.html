<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보스 리셋 타이머</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#eef2ff;font-family:Arial,sans-serif}
main{max-width:850px;margin:30px auto;padding:18px}
h1{font-size:26px;margin:0 0 10px}
p,small{color:#aab5ce;line-height:1.6}
.panel,.boss{background:#1b2335;border:1px solid #303c55;border-radius:14px;padding:18px;margin:16px 0}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;color:#bdc8df;font-size:14px}
input,select,button{font:inherit;border-radius:8px;padding:11px}
input,select{width:100%;margin-top:7px;background:#111827;color:white;border:1px solid #42506b}
button{border:0;background:#8eabff;color:#101522;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.1)}
.tools{display:flex;flex-wrap:wrap;gap:9px}
.secondary{background:#33415e;color:white}
.danger{background:#593441;color:#ffccd6}
.wide{grid-column:1/-1}
.boss-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{margin:0;font-size:19px;overflow-wrap:anywhere}
.count{font-size:44px;font-weight:bold;color:#9bb4ff;margin:12px 0;font-variant-numeric:tabular-nums}
.soon .count{color:#ffd275}
#message{color:#ffd275;line-height:1.6}
#log{padding-left:20px;color:#bdc8df;line-height:1.8}
@media(max-width:550px){
form{grid-template-columns:1fr}
main{margin:10px auto}
}
</style>
</head>
<body>
<main>
<h1>🔔 보스 리셋 타이머</h1>
<p>보스마다 10분~4시간 주기를 따로 설정하세요.</p>

<div class="panel">
<div class="tools">
<button id="enable" type="button">알람 켜기 / 테스트</button>
<button id="mute" class="secondary" type="button">소리 끄기</button>
<button id="notify" class="secondary" type="button">브라우저 알림 허용</button>
<button id="pip" class="secondary" type="button">작은 창 보기 (PiP)</button>
</div>
<p id="status">소리 알람 꺼짐 · 알람 켜기 버튼을 눌러주세요.</p>
<small>
페이지를 열어두어야 작동합니다.
PC 절전·탭 종료 시 알람이 울리지 않으며,
백그라운드에서는 알림이 늦어질 수 있습니다.
설정은 현재 브라우저에만 저장됩니다.
</small>
</div>

<form id="form" class="panel">
<label>보스 이름
<input id="name" placeholder="예: 오르비스 하층" maxlength="40" required>
</label>

<label>첫 리셋 날짜와 시간
<input id="start" type="datetime-local" step="1" required>
</label>

<label>리셋 주기
<select id="period"></select>
</label>

<button type="submit">보스 타이머 등록</button>

<small class="wide">
시간은 현재 기기의 시간대를 따릅니다.
과거 시간을 입력하면 해당 시각부터 선택한 주기로
다음 리셋을 계산합니다.
</small>
</form>

<p id="message" role="status"></p>
<div id="list"></div>

<div class="panel">
<strong>최근 알림</strong>
<ul id="log"><li>아직 알림이 없습니다.</li></ul>
</div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const KEY = "boss-reset-timers-v1";
let bosses = [];
let soundOn = false;
let audioContext = null;
let pipWindow = null;
let pipList = null;
let lastTick = Date.now();
const logs = [];
const fired = new Map();

function periodMinutes(value) {
  const n = Number(value);
  return Number.isInteger(n) &&
    n >= 10 && n <= 240 && n % 10 === 0 ? n : 20;
}

function periodLabel(value) {
  const n = periodMinutes(value);
  const hours = Math.floor(n / 60);
  const minutes = n % 60;
  return (hours ? hours + "시간" : "") +
    (hours && minutes ? " " : "") +
    (minutes ? minutes + "분" : "");
}

for (let minutes = 10; minutes <= 240; minutes += 10) {
  const option = document.createElement("option");
  option.value = minutes;
  option.textContent = periodLabel(minutes);
  option.selected = minutes === 20;
  $("period").append(option);
}

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (Array.isArray(saved)) {
    bosses = saved.filter(b =>
      b && typeof b.id === "string" &&
      typeof b.name === "string" &&
      Number.isFinite(b.start)
    ).map(b => ({
      id: b.id,
      name: b.name,
      start: b.start,
      minutes: periodMinutes(b.minutes),
      added: Number.isFinite(b.added) ? b.added : 0
    }));
  }
} catch {
  $("message").textContent =
    "저장 정보를 불러오지 못했습니다. 다시 등록해주세요.";
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(bosses));
    return true;
  } catch {
    $("message").textContent =
      "설정을 저장하지 못했습니다. 브라우저 저장 설정을 확인해주세요.";
    return false;
  }
}

function localInputTime(date) {
  const pad = n => String(n).padStart(2, "0");
  return date.getFullYear() + "-" +
    pad(date.getMonth() + 1) + "-" +
    pad(date.getDate()) + "T" +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes()) + ":" +
    pad(date.getSeconds());
}

$("start").value = localInputTime(new Date());

function formatTime(time) {
  return new Date(time).toLocaleString("ko-KR", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

function periodMs(boss) {
  return periodMinutes(boss.minutes) * 60000;
}

function nextReset(boss, now) {
  if (now < boss.start) return boss.start;
  const period = periodMs(boss);
  return boss.start +
    (Math.floor((now - boss.start) / period) + 1) * period;
}

function countdown(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const seconds = String(total % 60).padStart(2, "0");
  const minutes = Math.floor(total / 60) % 60;
  const hours = Math.floor(total / 3600);

  return hours
    ? hours + ":" + String(minutes).padStart(2, "0") + ":" + seconds
    : String(minutes).padStart(2, "0") + ":" + seconds;
}

function beep(ready) {
  if (!soundOn || !audioContext ||
      audioContext.state !== "running") return;

  const count = ready ? 2 : 4;
  for (let i = 0; i < count; i++) {
    const start = audioContext.currentTime + i * 0.3;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = ready ? 660 : 880;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start + 0.25);
  }
}

$("enable").onclick = async () => {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) throw new Error("unsupported");
    if (!audioContext) audioContext = new Audio();

    await audioContext.resume();
    soundOn = audioContext.state === "running";

    $("status").textContent = soundOn
      ? "소리 알람 켜짐 · 1분 전과 리셋 시각에 울립니다."
      : "소리를 켜지 못했습니다. 버튼을 다시 눌러주세요.";

    beep(false);
  } catch {
    $("status").textContent =
      "소리를 켜지 못했습니다. 브라우저 소리 설정을 확인해주세요.";
  }
};

$("mute").onclick = () => {
  soundOn = false;
  $("status").textContent = "소리 알람 꺼짐";
};

$("notify").onclick = async () => {
  if (!("Notification" in window)) {
    $("message").textContent = "이 브라우저는 알림을 지원하지 않습니다.";
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    $("message").textContent = permission === "granted"
      ? "브라우저 알림이 허용되었습니다."
      : "알림이 허용되지 않았습니다. 사이트 권한 설정을 확인해주세요.";
  } catch {
    $("message").textContent = "브라우저 알림을 켜지 못했습니다.";
  }
};

function announce(boss, ready, eventTime, now) {
  const text = boss.name +
    (ready ? " · 리셋 1분 전!" : " · 리셋 시간!") +
    (now - eventTime > 5000 ? " (지연 알림)" : "");

  $("message").textContent = text;
  beep(ready);

  if ("Notification" in window &&
      Notification.permission === "granted") {
    try {
      new Notification(text, {
        body: "예정 시각: " + formatTime(eventTime),
        tag: boss.id + "-" + eventTime + "-" + ready
      });
    } catch {}
  }

  logs.unshift(formatTime(now) + " — " + text);
  logs.splice(10);

  $("log").replaceChildren();
  logs.forEach(text => {
    const li = document.createElement("li");
    li.textContent = text;
    $("log").append(li);
  });
}

function renderList(container, compact, now) {
  const doc = container.ownerDocument;
  container.replaceChildren();

  if (!bosses.length) {
    const p = doc.createElement("p");
    p.textContent = "등록된 보스가 없습니다.";
    container.append(p);
    return;
  }

  bosses.forEach(boss => {
    const next = nextReset(boss, now);
    const card = doc.createElement("section");
    card.className = "boss";
    card.classList.toggle("soon", next - now <= 60000);

    const header = doc.createElement("div");
    header.className = "boss-head";

    const title = doc.createElement("h2");
    title.textContent = boss.name;
    header.append(title);

    if (!compact) {
      const remove = doc.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "삭제";
      remove.onclick = () => {
        bosses = bosses.filter(b => b.id !== boss.id);
        save();
        updateDisplay();
      };
      header.append(remove);
    }

    const count = doc.createElement("div");
    count.className = "count";
    count.textContent = countdown(next - now);

    const detail = doc.createElement("small");
    detail.textContent = "다음 " + formatTime(next) +
      " · " + periodLabel(boss.minutes) + " 주기";

    card.append(header, count, detail);
    container.append(card);
  });
}

let lastDisplay = 0;

function updateDisplay(now = Date.now()) {
  renderList($("list"), false, now);
  if (pipWindow && !pipWindow.closed && pipList) {
    renderList(pipList, true, now);
  }
  lastDisplay = now;
}

$("form").onsubmit = event => {
  event.preventDefault();

  const name = $("name").value.trim();
  const start = new Date($("start").value).getTime();

  if (!name || !Number.isFinite(start)) {
    $("message").textContent = "보스 이름과 시간을 확인해주세요.";
    return;
  }

  const now = Date.now();

  bosses.push({
    id: now.toString(36) + Math.random().toString(36).slice(2),
    name,
    start,
    minutes: periodMinutes($("period").value),
    added: now
  });

  if (save()) {
    $("message").textContent = name + " 타이머를 등록했습니다.";
  }

  $("name").value = "";
  updateDisplay();
};

function tick() {
  const now = Date.now();
  if (now < lastTick) lastTick = now;

  bosses.forEach(boss => {
    const since = Math.max(lastTick, now - 90000, boss.added);

    [60000, 0].forEach(offset => {
      const firstEvent = boss.start - offset;
      const period = periodMs(boss);
      const cycle = Math.floor((now - firstEvent) / period);
      if (cycle < 0) return;

      const eventTime = firstEvent + cycle * period;
      const key = boss.id + ":" + offset + ":" + cycle;

      if (eventTime > since && eventTime <= now && !fired.has(key)) {
        fired.set(key, now);
        announce(boss, offset === 60000, eventTime, now);
      }
    });
  });

  for (const [key, time] of fired) {
    if (now - time > 180000) fired.delete(key);
  }

  lastTick = now;
  if (Math.floor(now / 1000) !== Math.floor(lastDisplay / 1000)) {
    updateDisplay(now);
  }
}

$("pip").onclick = async () => {
  if (!("documentPictureInPicture" in window)) {
    $("message").textContent =
      "PiP를 지원하지 않는 브라우저입니다. PC 최신 크롬에서 사용해주세요.";
    return;
  }

  if (pipWindow && !pipWindow.closed) {
    pipWindow.focus();
    return;
  }

  try {
    const win = await window.documentPictureInPicture.requestWindow({
      width: 360,
      height: 220
    });

    pipWindow = win;
    const doc = win.document;
    doc.documentElement.lang = "ko";
    doc.title = "보스 타이머";

    const style = doc.createElement("style");
    style.textContent = `
      *{box-sizing:border-box}
      body{
        margin:0;padding:10px;background:#101522;
        color:#eef2ff;font-family:Arial,sans-serif
      }
      h1{font-size:15px;margin:0 0 8px}
      .boss{
        background:#1b2335;border:1px solid #303c55;
        border-radius:10px;padding:10px;margin:0 0 8px
      }
      .boss-head{
        display:flex;justify-content:space-between;gap:8px
      }
      h2{font-size:16px;margin:0;overflow-wrap:anywhere}
      .count{
        font-size:32px;font-weight:bold;color:#9bb4ff;
        margin:5px 0;font-variant-numeric:tabular-nums
      }
      .soon .count{color:#ffd275}
      small{font-size:11px;color:#aab5ce;line-height:1.5}
      p{color:#aab5ce}
    `;
    doc.head.append(style);

    const title = doc.createElement("h1");
    title.textContent = "🔔 보스 리셋 타이머";
    pipList = doc.createElement("div");
    doc.body.append(title, pipList);

    win.addEventListener("pagehide", () => {
      if (pipWindow === win) {
        pipWindow = null;
        pipList = null;
      }
    }, {once:true});

    updateDisplay();
  } catch {
    $("message").textContent = "작은 창을 열지 못했습니다. 다시 눌러주세요.";
  }
};

updateDisplay();
setInterval(tick, 250);
document.addEventListener("visibilitychange", () => {
  tick();
  updateDisplay();
});
</script>
</body>
</html>
